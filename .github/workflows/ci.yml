name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Type check
        run: mypy
      - name: Fast test suite
        run: pytest -m "not integration"
      - name: Smoke test the non-editable install
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install . httpx
          cd /tmp && /tmp/smoke-venv/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  docker:
    # Builds the Space image and calls it. A build that succeeds is not an API that answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the serving image
        run: docker build -t govbr-classifier:ci .
      - name: Run it as the Space does
        run: docker run -d --name api -p 7860:7860 govbr-classifier:ci
      - name: Wait for liveness
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:7860/health/live && exit 0
            sleep 1
          done
          docker logs api
          exit 1
      - name: Classify one text
        run: |
          curl -fsS -X POST http://localhost:7860/v1/classify \
            -H "Content-Type: application/json" \
            -d '{"items": [{"text": "o app trava e nao abre"}]}' | tee response.json
          python3 -c "import json; b = json.load(open('response.json')); assert set(b['results'][0]['attributes']) == {'tema', 'bloqueio', 'tipo', 'acionabilidade'}, b"
      - name: Container logs
        if: always()
        run: docker logs api || true
