# Closed label lists for every attribute (ADR-05, ADR-06, ADR-09).
# Single source of truth: the API schemas, the LLM labeling prompt and the evaluation all read this file.
# Changing a label here is a model-version change and must be recorded in docs/adr.

version: 2   # 2: tema gains nao_especificado (ADR-05 revision, 2026-11-01)

attributes:
  tema:
    cardinality: multi
    description: What the review is about.
    exclusive: [outro, nenhum, nao_especificado]   # each can only appear alone
    labels:
      login_autenticacao: Cannot log in, password, two-factor, account access.
      verificacao_identidade: Facial recognition, document validation, account level (bronze/silver/gold).
      travamento: App crashes, closes or freezes.
      lentidao: App or a screen is slow.
      servico_nao_carrega: A specific service or page does not load or returns an error.
      atendimento: Support channels, lack of human help, unanswered requests.
      outro: A complaint about an identifiable subject that is not on this list.
      nao_especificado: A complaint with no identifiable subject (for example "péssimo", "não funciona").
      nenhum: No problem described (for example praise).

  bloqueio:
    cardinality: single
    description: Did the person manage to do what they wanted?
    labels:
      sim: The person was blocked from completing the task.
      nao: The person completed the task despite the problem, or the text reports no problem at all.
      nao_da_para_saber: The text does not say. A label about the text, not model uncertainty.

  tipo:
    cardinality: single
    description: Kind of feedback.
    labels:
      bug: Something does not work as expected.
      pedido_funcionalidade: Asks for something the app does not do.
      insatisfacao_geral: Dissatisfaction without a specific failure or request.
      nenhum: No problem described.

  acionabilidade:
    cardinality: single
    description: Is there enough information to act? See docs/rubric/annotation_rubric.pt.md.
    labels:
      sim: Names at least one of service, feature or channel, failing step, error message, device or OS.
      nao: None of the above.

# Fields used only while annotating (human pilot and spreadsheet, and the LLM labeler for ood_manual).
# The API never reads this section: taxonomy.py parses `attributes` only. Nothing here is a label the
# model predicts, so changing it is not a model-version change. Rules: docs/rubric/annotation_rubric.pt.md.
annotation:
  ood_manual:
    description: Annotator's out-of-distribution call. Names match the API's OodReason, plus nao.
    none_value: nao   # absence of a reason; every other value must be an OodReason
    values:
      nao: In Portuguese and about the gov.br app or its services. Annotate the four attributes.
      language: Mostly in another language.
      low_text_quality: No readable word (emoji or punctuation only, a meaningless string).
      off_domain: Not about the app or any of its services.
  obrigatoriedade:
    description: Auxiliary box, not a label. Checked when the text says the person is forced to use the app or one of its mechanisms.
  duvida:
    description: Main source of doubt for the item, explained in nota_duvida. Blank when there is none.
    values:
      ood: Unclear which ood_manual value applies.
      tema_limite: Between two themes, or a theme and an escape value.
      tipo: Between two tipo values, even with the precedence rule.
      bloqueio: Unclear whether the task was completed.
      acionabilidade: Unclear whether what was named counts as service, step, error or device.
      cortado: The truncated part could change the answer.
      enfase: Unclear whether the emphasis changes the reading.
      sarcasmo: Ambiguous irony, literal reading annotated.
      obrigatoriedade: Unclear whether there is obligation, or which mechanism.
      outro_caso: Anything else; describe it.
