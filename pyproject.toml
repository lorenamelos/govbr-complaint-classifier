[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govbr-complaint-classifier"
version = "0.1.0"
description = "Multi-attribute classifier of gov.br app complaints, served behind a public API with honest evaluation and silent-failure detection."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Lorena" }]

# Runtime dependencies only: this is what the served container installs.
# Anything used only for collection, labeling or analysis lives in an extra below.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "limits>=3.13",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Collecting Google Play reviews (offline and in the weekly job).
data = [
    # Pinned exactly: data/collect.py calls a private function of this version.
    "google-play-scraper==1.2.7",
    "pyarrow>=16.0",
    # Annotation spreadsheet (annotation/ only; the API never imports it).
    "openpyxl>=3.1",
]
# LLM labeling of the training set and the offline cost benchmark (ADR-19, ADR-20).
labeling = [
    "anthropic>=0.40",
]
# Notebooks and visualization. Plotly is the only plotting library in this repo.
analysis = [
    "plotly>=5.22",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

# The taxonomy travels inside the package so the installed API can read it.
[tool.setuptools.package-data]
govbr_classifier = ["taxonomy.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs network, a database or a trained model; excluded from the fast suite",
]

[tool.mypy]
python_version = "3.11"
packages = ["govbr_classifier"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
